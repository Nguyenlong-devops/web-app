# Run together with docker-compose.yml after generating certificates.
services:
  web-app:
    environment:
      ASSET_PUBLIC_BASE_URL: ${ASSET_PUBLIC_BASE_URL:-https://192.168.99.82}

  https-proxy:
    image: nginx:stable-alpine
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx.https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server.crt
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server.key
        target: /etc/nginx/tls/server.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - web-app
    restart: always
    networks:
      - it_dashboard_net
